name: Build

# The unconditional gate: every push and every PR compiles this module and runs its unit tests.
# Nothing else in the refactor is verifiable without it (docs/refactor/02-execution-order.md, Phase 0).
#
# shared has no BotMaker dependency of its own, so this is the one Java repo whose CI is a plain build.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The OCR tests skip themselves without these (ocr/OcrEngineTest), and skipped is not covered. -dev is the
      # package carrying the unversioned libtesseract.so/liblept.so symlinks JNA resolves by bare name; the
      # traineddata is bundled in the jar, so no tesseract-ocr-* language package is needed.
      - name: Install OCR natives
        run: sudo apt-get update && sudo apt-get install -y libtesseract-dev libleptonica-dev

      - name: Verify
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
