name: Session live tests

# Phase 6 of the bot-owned-display plan: the nested-session supervisor is proven end-to-end on a real box,
# and re-proven here headlessly. Xvfb is the host X server; our Xephyr :N nests inside it, so the same live
# NestedSessionLiveTest that a maintainer runs on their desktop runs unattended in CI. GitHub runners have no
# per-user systemd/session bus, so SessionReaper takes its ProcessBuilder descendant-kill fallback here (the
# systemd --scope path is exercised on the real box) — either way the test asserts zero orphan Xephyr.

on:
  push:
    paths:
      - 'src/main/java/com/botmaker/shared/session/**'
      - 'src/main/java/com/botmaker/shared/capture/linux/**'
      - 'src/test/java/com/botmaker/shared/session/**'
      - '.github/workflows/session-live.yml'
  pull_request:
    paths:
      - 'src/main/java/com/botmaker/shared/session/**'
      - 'src/main/java/com/botmaker/shared/capture/linux/**'
      - 'src/test/java/com/botmaker/shared/session/**'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install the nested-display stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xserver-xephyr openbox \
            x11-utils x11-xserver-utils x11-apps xterm xdotool xauth

      - name: Run the live session suite under Xvfb
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            mvn -B test \
              -Dtest=NestedSessionLiveTest \
              -Dbotmaker.live=true \
              -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
